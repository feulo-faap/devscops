name: Python Tests

on:
  push:
    branches:
      - main
      - develop

  pull_request:

jobs:

  tests:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          python -m pip install --upgrade pip
          pip install -r devsecops-lab/requirements.txt

      - run: |
          python devsecops-alb/criar_db.py

      - run: |
          python -m compileall devsecops-lab