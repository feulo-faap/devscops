name: Dependency Scan

on:

  push:

  pull_request:

jobs:

  audit:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |

          pip install pip-audit

      - run: |

          pip install -r devsecops-lab/requirements.txt

      - run: |

          pip-audit