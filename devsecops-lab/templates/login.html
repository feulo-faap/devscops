{% extends 'base.html' %}

{% block conteudo %}

<div class="row">

<div class="col-4">

<h3>

Login

</h3>

<form

action="/autenticar"

method="post">

<div class="mb-3">

<label>

Usuário

</label>

<input

class="form-control"

name="usuario">

</div>

<div class="mb-3">

<label>

Senha

</label>

<input

type="password"

class="form-control"

name="senha">

</div>

<button

class="btn btn-primary">

Entrar

</button>

</form>

</div>

</div>

{% endblock %}
